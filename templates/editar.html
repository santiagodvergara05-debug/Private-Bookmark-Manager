{% extends "base.html" %}
{% block titulo %}Editar marcador — PBM{% endblock %}
{% block contenido %}
    <div class="nav-volver">
        <a href="{{ url_for('marcadores.home') }}" class="btn-nav">⬅️ Volver a Mis Marcadores</a>
    </div>

    <h1>✏️ Editar marcador</h1>

    <div class="tarjeta-config" style="max-width: 520px;">
        <form method="POST" class="form-config-panel">
            <div class="campo-grupo">
                <label for="titulo">Título del marcador:</label>
                <input type="text" id="titulo" name="titulo" value="{{ marcador['titulo'] }}" required>
            </div>

            <div class="campo-grupo">
                <label for="url">Dirección URL:</label>
                <input type="url" id="url" name="url" value="{{ marcador['url'] }}" required>
            </div>

            <div class="campo-grupo">
                <label for="nota">Nota o recordatorio (opcional):</label>
                <textarea id="nota" name="nota" rows="3" placeholder="Ej: Manga/serie, notas sobre la lectura...">{{ marcador['nota'] or '' }}</textarea>
            </div>

            <div class="campo-grupo">
    <label for="progreso">Progreso numérico (opcional):</label>
    <input type="number" id="progreso" name="progreso" min="0" value="{{ marcador['progreso'] or 0 }}" placeholder="0" class="input-corto">
    <small style="display:block; margin-top:4px; color:#888; font-size:0.8rem;">
        Número de capítulo, episodio o tomo. Dejalo en 0 si es un marcador común.
    </small>
</div>

            <div class="campo-grupo">
                <label for="carpeta_id">Carpeta contenedora:</label>
                <select id="carpeta_id" name="carpeta_id">
                    <option value="" {% if not marcador['carpeta_id'] %}selected{% endif %}>Raíz (Sin carpeta)</option>
                    {% for c in todas_las_carpetas %}
                        <option value="{{ c['id'] }}" {% if c['id'] == marcador['carpeta_id'] %}selected{% endif %}>📁 {{ c['nombre'] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-acciones-edicion">
                <button type="submit" class="btn-primario">💾 Guardar cambios</button>
                <a href="{{ url_for('marcadores.home') }}" class="btn-nav">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
