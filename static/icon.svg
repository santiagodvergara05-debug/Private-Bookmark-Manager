<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Fondo con gradiente oscuro -->
    <linearGradient id="pbm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Gradiente cian neón para el marcador -->
    <linearGradient id="pbm-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Relleno translúcido para el interior del marcador -->
    <linearGradient id="pbm-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Gradiente dorado/ámbar para el candado de privacidad -->
    <linearGradient id="pbm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Filtro de resplandor neón -->
    <filter id="pbm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base oscura redondeada -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#pbm-bg)" stroke="#334155" stroke-width="2"/>

  <!-- Cinta de marcador web (Bookmark) con resplandor -->
  <g filter="url(#pbm-glow)">
    <path d="M 40 22 H 88 C 91.3 22 94 24.7 94 28 V 98 L 64 78 L 34 98 V 28 C 34 24.7 36.7 22 40 22 Z" 
          fill="url(#pbm-fill)" 
          stroke="url(#pbm-cyan)" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>
  </g>

  <!-- Candado de seguridad (Privacidad) en tono dorado -->
  <g transform="translate(0, 2)">
    <!-- Grillete del candado -->
    <path d="M 56 49 V 42 C 56 37.5 59.5 34 64 34 C 68.5 34 72 37.5 72 42 V 49" 
          fill="none" 
          stroke="url(#pbm-gold)" 
          stroke-width="4" 
          stroke-linecap="round"/>

    <!-- Cuerpo del candado -->
    <rect x="52" y="49" width="24" height="19" rx="4" fill="url(#pbm-gold)"/>

    <!-- Ojo de la cerradura -->
    <circle cx="64" cy="56" r="2.2" fill="#0b1120"/>
    <path d="M 64 57 V 63" stroke="#0b1120" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Destello de energía decorativo en la esquina -->
  <circle cx="88" cy="30" r="2" fill="#38bdf8"/>
</svg>
